name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_cards.py
      - tests/test_generate_cards.py
      - .github/workflows/update-readme.yml
  pull_request:
    paths:
      - scripts/generate_cards.py
      - tests/test_generate_cards.py
      - .github/workflows/update-readme.yml

concurrency:
  group: readme-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test card generation
        run: python -m unittest discover -s tests -v

      - name: Generate public stats and project cards
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python scripts/generate_cards.py --owner "$PROFILE_OWNER"

      - name: Commit cards
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update README cards"
          git push
